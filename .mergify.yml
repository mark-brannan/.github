# The Mergify configuration every repository under this account shares. A
# repository opts in with a one-line `.mergify.yml`:
#
#     extends: .github
#
# and overrides a rule by restating it under the same name. Mergify does three
# things here, and none of them needs a comment or a click.
#
# 1. It keeps open pull requests up to date with main. The branch ruleset
#    requires branches to be up to date before merging, so without this every
#    merge to main leaves the rest of the open pull requests stale.
# 2. It merges dependabot's updates once the gate is green. Dependabot is the
#    volume, and the part nobody is really reviewing.
# 3. It offers the merge queue for anything else, on request: `@mergifyio queue`.
#
# Human pull requests are deliberately NOT auto-merged. The ruleset requires no
# approvals, so an automatic trigger would land work in progress the moment CI
# went green.
#
# The check is `ci-gate / gate`: the `gate` job of the reusable ci-gate
# workflow in this repository, called from a job named `ci-gate`. GitHub names
# a reusable workflow's checks "<caller job> / <called job>", so that is the
# one context the rulesets require and the one this file waits on.
# The branch rulesets require branches to be up to date before merging
# (`strict_required_status_checks_policy`), and that is incompatible with a
# batching, two-step queue: Mergify refuses the whole ruleset and every queued
# pull request stalls with "Configuration not compatible". The compatible shape
# is in-place checks -- one pull request checked at a time, against real main,
# with nothing to re-check on the way out. Merges serialize, which at this
# account's volume costs nothing, and the up-to-date guarantee stays.
merge_queue:
  max_parallel_checks: 1

queue_rules:
  - name: default
    merge_method: squash
    # One at a time: a batch is checked as a speculative merge commit, which is
    # the thing the strict policy rejects.
    batch_size: 1
    # Explicit rather than inherited: without this Mergify falls back to the
    # branch's required checks, and would merge on a repo that gates nothing.
    queue_conditions:
      - check-success=ci-gate / gate
    # Identical to queue_conditions on purpose. Any difference makes this a
    # two-step queue -- checked once to enter, again to leave -- which is the
    # other half of the incompatibility.
    merge_conditions:
      - check-success=ci-gate / gate

pull_request_rules:
  - name: Update pull requests that have fallen behind main
    conditions:
      - base=main
      - -draft
      - -conflict
      - -closed
      - '#commits-behind>0'
      # Automatic rules are not covered by commands_restrictions, and anyone
      # with read access can open a pull request off an existing branch of a
      # public repo. Without this, that stranger's pull request would have
      # Mergify write a merge commit into a branch they cannot push to.
      - or:
          - author=mark-brannan
          # Every bot here is a GitHub App the owner installed -- dependabot,
          # and each repository's own release-please app, whose login is
          # named after the repository -- so a bot author is trusted by
          # construction rather than by listing.
          - author~=\[bot\]$
          # A fork's head branch is outside this repository.
          - from-fork
    actions:
      update: {}

  - name: Merge dependabot updates once the gate is green
    conditions:
      - base=main
      - -draft
      - -conflict
      - author=dependabot[bot]
    actions:
      queue:
        name: default

  - name: Label a pull request awaiting-human when it is green and every review thread is resolved
    # "Mark's turn" as a label GitHub search can filter on, so his queue is one
    # bookmark: github.com/pulls?q=is:open+user:mark-brannan+label:awaiting-human
    # Toggle, not add: a push that turns the gate red or a bot that opens a
    # thread takes the label off again, so it never says something stale.
    # Dependabot is left out because the rule above merges it unasked.
    conditions:
      - base=main
      - -draft
      - -conflict
      - -closed
      - -author=dependabot[bot]
      - check-success=ci-gate / gate
      - "#review-threads-unresolved=0"
    actions:
      label:
        toggle:
          - awaiting-human
