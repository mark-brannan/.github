name: complexity

# Shared by every repository: how the cyclomatic complexity of each function a
# pull request touches moved, base to head, written to the job summary. A
# measurement, not a gate: the engine exits 0 whatever the numbers say, so
# callers leave this job out of ci-gate's needs.
#
# The engine is .github/scripts/complexity.py in this repository (stdlib
# Python); this workflow fetches it, installs the three tools it drives and runs
# it, the same mechanism as nonempty-diff.yml. It routes each changed file by
# extension or shebang -- lizard for Python, JS/TS, Go, Rust and the rest it
# knows, shellmetrics for sh/bash -- so a mixed repo needs no configuration.
#
# rust-code-analysis also reads the files lizard handles, adding cognitive
# complexity, Halstead measures and the maintainability index. The summary
# shows cyclomatic and cognitive; every metric per function goes in the
# `complexity` artifact (complexity.json, kept 90 days), logged, never weighted.
#
# The summary is also posted on the pull request as one comment, replaced on
# each push, so a reviewer or the next session sees it without opening the
# run. That needs `pull-requests: write`; without it (a fork's token, a caller
# that grants only `contents: read`) the comment is skipped with a notice and
# the job stays green.
#
# The tools are third-party, so they are pinned: lizard by version,
# shellmetrics (a single script) by commit and checksum, rust-code-analysis
# (a release binary) by version and checksum.
#
#     jobs:
#       complexity:
#         permissions:
#           contents: read
#           pull-requests: write
#         uses: mark-brannan/.github/.github/workflows/complexity.yml@main

# No ref input: the engine always comes from main, except on this
# repository's own PRs, which run the engine they carry from their checkout.
on:
  workflow_call:

env:
  LIZARD_VERSION: 1.24.1
  SHELLMETRICS_COMMIT: b3bfff2af6880443112cdbf2ea449440b30ab9b0
  SHELLMETRICS_SHA256: 1aab5caf551811a506f11e569a1c4cf00ddd960d9212428531efb075f45d0a5d
  RCA_VERSION: v0.0.25
  RCA_SHA256: 9ec2a217b8ff191e02dab5d5f2eee6158b63fd975c532b2c5d67c2e6c7249894

jobs:
  complexity:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: github.repository != 'mark-brannan/.github'
        uses: actions/checkout@v7
        with:
          repository: mark-brannan/.github
          ref: main
          sparse-checkout: |
            /.github/scripts/complexity.py
          sparse-checkout-cone-mode: false
          path: .complexity-engine
          persist-credentials: false
      - name: Install lizard, shellmetrics and rust-code-analysis
        run: |
          set -euo pipefail
          python3 -m pip install -q "lizard==$LIZARD_VERSION"
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          curl -fsSL "https://raw.githubusercontent.com/shellspec/shellmetrics/$SHELLMETRICS_COMMIT/shellmetrics" \
            -o "$tools/shellmetrics"
          echo "$SHELLMETRICS_SHA256  $tools/shellmetrics" | sha256sum -c -
          chmod +x "$tools/shellmetrics"
          curl -fsSL "https://github.com/mozilla/rust-code-analysis/releases/download/$RCA_VERSION/rust-code-analysis-linux-cli-x86_64.tar.gz" \
            -o "$tools/rca.tar.gz"
          echo "$RCA_SHA256  $tools/rca.tar.gz" | sha256sum -c -
          tar -xzf "$tools/rca.tar.gz" -C "$tools" rust-code-analysis-cli
          echo "$tools" >> "$GITHUB_PATH"
      - name: complexity
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          SELF: ${{ github.repository == 'mark-brannan/.github' }}
        run: |
          set -euo pipefail
          engine=.complexity-engine/.github/scripts/complexity.py
          if [ "$SELF" = true ]; then engine=.github/scripts/complexity.py; fi
          echo "engine: $engine · lizard $(lizard --version) · shellmetrics $SHELLMETRICS_COMMIT · rust-code-analysis $RCA_VERSION"
          python3 "$engine" --base "$BASE" --require-tools \
            --json "$RUNNER_TEMP/complexity.json" > "$RUNNER_TEMP/complexity.md"
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/complexity.md"
      - name: Post the summary on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mark='<!-- complexity-report -->'
          body="$RUNNER_TEMP/comment.md"
          {
            echo "$mark"
            cat "$RUNNER_TEMP/complexity.md"
            echo
            echo "For ${HEAD:0:12}, by [complexity]($RUN_URL); every metric is in that run's \`complexity\` artifact."
          } > "$body"
          # A comment holds 65536 characters; past that, keep the table and drop the collapsed metrics.
          if [ "$(wc -c < "$body")" -gt 60000 ]; then
            sed -i '/^<details>$/,/^<\/details>$/d' "$body"
          fi
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$mark\")) | .id] | first // empty" 2>/dev/null | head -n1 || true)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$body" > /dev/null \
              || echo "::notice::complexity: could not update comment $id; the report is in the job summary."
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$body" > /dev/null \
              || echo "::notice::complexity: could not comment (needs pull-requests: write); the report is in the job summary."
          fi
      - name: Upload every metric
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: complexity
          path: ${{ runner.temp }}/complexity.json
          if-no-files-found: ignore
          retention-days: 90
