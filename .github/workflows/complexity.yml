name: complexity

# Shared by every repository: how the cyclomatic complexity of each function a
# pull request touches moved, base to head, written to the job summary. A
# measurement, not a gate: the engine exits 0 whatever the numbers say, so
# callers leave this job out of ci-gate's needs.
#
# The engine is `complexity` in mark-brannan/claude (`bin/`, stdlib Python);
# this workflow fetches it, installs the two tools it drives and runs it, the
# same mechanism as prose-budget.yml. It routes each changed file by
# extension or shebang -- lizard for Python, JS/TS, Go, Rust and the rest it
# knows, shellmetrics for sh/bash -- so a mixed repo needs no configuration.
#
# The tools are third-party, so they are pinned: lizard by version,
# shellmetrics (a single script) by commit and checksum.
#
#     jobs:
#       complexity:
#         permissions:
#           contents: read
#         uses: mark-brannan/.github/.github/workflows/complexity.yml@main

on:
  workflow_call:
    inputs:
      claude-ref:
        description: Ref of mark-brannan/claude to fetch the engine from; defaults to main, override to test an engine branch early
        required: false
        type: string
        default: main

env:
  LIZARD_VERSION: 1.24.1
  SHELLMETRICS_COMMIT: b3bfff2af6880443112cdbf2ea449440b30ab9b0
  SHELLMETRICS_SHA256: 1aab5caf551811a506f11e569a1c4cf00ddd960d9212428531efb075f45d0a5d

jobs:
  complexity:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: mark-brannan/claude
          ref: ${{ inputs.claude-ref }}
          sparse-checkout: |
            /bin/complexity
            /lib/gitrun.py
          sparse-checkout-cone-mode: false
          path: .complexity-engine
          persist-credentials: false
      - name: Install lizard and shellmetrics
        run: |
          set -euo pipefail
          python3 -m pip install -q "lizard==$LIZARD_VERSION"
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          curl -fsSL "https://raw.githubusercontent.com/shellspec/shellmetrics/$SHELLMETRICS_COMMIT/shellmetrics" \
            -o "$tools/shellmetrics"
          echo "$SHELLMETRICS_SHA256  $tools/shellmetrics" | sha256sum -c -
          chmod +x "$tools/shellmetrics"
          echo "$tools" >> "$GITHUB_PATH"
      - name: complexity
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          CLAUDE_REF: ${{ inputs.claude-ref }}
        run: |
          set -euo pipefail
          echo "engine: claude ref $CLAUDE_REF · lizard $(lizard --version) · shellmetrics $SHELLMETRICS_COMMIT"
          python3 .complexity-engine/bin/complexity --base "$BASE" --require-tools | tee -a "$GITHUB_STEP_SUMMARY"
