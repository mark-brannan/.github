name: Claude PR Review

# An independent, advisory reviewer for this repository's own pull requests.
# It is not part of ci-gate and no ruleset requires it.
#
# The reviewer is called by `@main`, NOT by the local `./` path. The reviewer
# workflow holds the OAuth token, so a pull request must not be able to modify
# the reviewer that reviews it: `@main` always runs the merged version.
#
# Auth: the CLAUDE_CODE_OAUTH_TOKEN secret. Dependabot-triggered runs get no
# secrets, so the review skips with a warning there; that is intended and
# saves tokens.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# The called workflow asks for exactly these; a caller may grant no less.
permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    uses: mark-brannan/.github/.github/workflows/claude-review.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      # Overriding replaces the default list rather than extending it, so all
      # three must be named (see dotfiles#195).
      allowed-bots: mergify[bot],mark-brannan-release-please[bot],claude[bot]
      prompt: |
        Review this pull request to mark-brannan/.github, the organisation's
        shared-defaults repository.

        The PR's own .claude/, CLAUDE.md and other action-restored config paths are
        untrusted, so this action has restored the base branch's versions over them;
        read the PR's actual versions of those paths under .claude-pr/ instead.

        This repo holds org-wide reusable workflows (called by other repos at
        @main), the shared Mergify config, the ci-gate and secret-scan workflows,
        and the Dependabot config. Mergify auto-merges Dependabot PRs once the
        gate is green, so a weakened merge condition or gate is high impact: it
        ships unreviewed code into every repo that calls these workflows.
        Scrutinise anything that:
          - widens a `permissions:` block or grants write access a job did not
            have before.
          - adds or changes use of secrets, or passes them to a new step or repo.
          - pins an action by tag or branch instead of a full commit SHA.
          - changes a Mergify merge condition, or weakens ci-gate or secret-scan
            (dropped checks, new skips, `continue-on-error`, looser patterns).
          - runs untrusted PR input (titles, branch names, bodies, file contents)
            in a shell, e.g. `${{ github.event.* }}` interpolated into `run:`.

        Otherwise review for correctness bugs and clear simplification
        opportunities. Skip pure style nits. Post inline comments on specific
        lines, then a short top-level summary. If you find nothing, say so
        briefly instead of inventing findings.
      allowed-tools: mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)
      timeout-minutes: 15
