name: pr-title

# A squash merge takes the pull request title as the commit subject (each
# calling repo sets its squash commit title to "pull request title"; the
# default uses a lone commit's own subject instead), so the title is the one
# line of history that every repo's log is read by, and the line
# release-please reads. The shape is `type(area): summary`
# ("fix(doctor): the version row sits under Claude Code"), the same in every
# repo whether or not it releases, so history reads alike everywhere and a
# repo that starts releasing needs no change. The check holds a title to
# that shape and nothing more -- it does not choose among types or areas.
# `conventional: false` relaxes it to `area: summary`, for a repo whose
# history should not carry types.
#
# Reusable, like nonempty-diff: callers list it in their ci-gate `needs`, so
# it costs no ruleset entry. Cost: one job of seconds per PR event. Callers
# keep the default pull_request types; adding `edited` would rerun every job
# in `needs` on each body edit. Instead the job reads the live title, so the
# fix for a bad title is to edit it and re-run this job -- a re-run replays
# the original event, whose payload still holds the old title.
#
# A push run checks the title of the open pull request whose head is the
# pushed commit, so a caller that also runs on branch pushes gets the same
# verdict from both `ci-gate / gate` runs -- except on a push made before
# its pull request is opened, which finds none and passes. The cure for that
# is in the caller: run push CI on the default branch only. Exempt: a push
# with no open pull request has no title, and a bot's PR (Dependabot,
# release-please) has a title nobody edits by hand.

on:
  workflow_call:
    inputs:
      conventional:
        description: >-
          Require a conventional-commit type, `type(area): summary`, as
          release-please reads them; false accepts `area: summary`.
        type: boolean
        default: true

permissions: {}

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - name: The title has the repo's shape
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          EVENT_TITLE: ${{ github.event.pull_request.title }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          SHA: ${{ github.sha }}
          # area: lowercase word, may hold . / _ - ; an optional (scope) and
          # !; then a colon, a space and a summary
          PATTERN: '^[a-z][a-z0-9._/-]*(\([^)]+\))?!?: [^ ].*$'
          # a type release-please knows, then a required (area)
          CONVENTIONAL: '^(feat|fix|perf|revert|docs|deps|chore|ci|test|build|refactor|style)\([^)]+\)!?: [^ ].*$'
          USE_CONVENTIONAL: ${{ inputs.conventional }}
        run: |
          set -euo pipefail
          if [ -z "$NUMBER" ]; then
            if ! OPEN=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.state == "open" and .head.sha == env.SHA)][0] | select(.) | "\(.number) \(.user.type) \(.title)"'); then
              echo "::warning::could not look up a pull request for $SHA: title not checked"
              exit 0
            fi
            if [ -z "$OPEN" ]; then
              echo "no open pull request for $SHA: no title to check"
              exit 0
            fi
            read -r NUMBER AUTHOR_TYPE EVENT_TITLE <<<"$OPEN"
          fi
          if [ "$AUTHOR_TYPE" = Bot ]; then
            echo "opened by a bot: title not checked"
            exit 0
          fi
          # The live title, so a re-run after an edit sees the edit; the
          # event's copy if the token cannot read the pull request.
          if ! TITLE=$(gh api "repos/$REPO/pulls/$NUMBER" --jq .title); then
            echo "::warning::could not read the live title; checking the event's copy, which a re-run does not refresh"
            TITLE=$EVENT_TITLE
          fi
          SHAPE='`area: summary` (for example "settings: deny the Mergify stack skill")'
          if [ "$USE_CONVENTIONAL" = true ]; then
            PATTERN=$CONVENTIONAL
            SHAPE='`type(area): summary` (for example "fix(doctor): the version row sits under Claude Code")'
          fi
          if [[ ! "$TITLE" =~ $PATTERN ]]; then
            echo "::error::title \"$TITLE\" is not $SHAPE. Edit the title, then re-run this job."
            exit 1
          fi
          echo "ok: $TITLE"
