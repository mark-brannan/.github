name: pr-title

# A squash merge takes the pull request title as the commit subject, so the
# title is the one line of history that every repo's log is read by. The
# repos' own convention is `area: summary` ("settings: deny the Mergify
# stack skill (#76)"); this check holds a title to that shape and nothing
# more -- it does not choose among areas, and it does not require
# conventional-commit types. Which shape the fleet enforces is the user's
# ruling (claude_prompts_scratch card 17913674070dd05771); change PATTERN
# below to follow it.
#
# Reusable, like nonempty-diff: callers list it in their ci-gate `needs`, so
# it costs no ruleset entry. Cost: one job of seconds per PR event. A caller
# triggers it on pull_request types opened, edited, reopened, synchronize.
# On a non-PR run (push to main) there is no title and it passes with a note.

on:
  workflow_call:

permissions: {}

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - name: The title reads `area: summary`
        env:
          TITLE: ${{ github.event.pull_request.title }}
          # area: lowercase word, may hold . / _ - ; then a colon, a space and a summary
          PATTERN: '^[a-z][a-z0-9._/-]*: [^ ].*$'
        run: |
          set -euo pipefail
          if [ -z "$TITLE" ]; then
            echo "not a pull request: no title to check"
            exit 0
          fi
          if [[ ! "$TITLE" =~ $PATTERN ]]; then
            echo "::error::title \"$TITLE\" is not \`area: summary\` (for example \"settings: deny the Mergify stack skill\"). Edit the title; the check reruns on edit."
            exit 1
          fi
          echo "ok: $TITLE"
