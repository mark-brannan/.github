name: secret-scan

# Shared by every repository: two independent scanners over the entire git
# history, not the diff. gitleaks is pattern/entropy -- it flags anything
# credential-shaped, live or not. trufflehog complements rather than
# duplicates it: it calls the provider's API to check whether a candidate
# credential still works, so a finding there is never a false alarm and is
# always urgent.
#
# Always full history (fetch-depth: 0), deliberately no paths: filter, and no
# fingerprint/cache skip like claude-review.yml's: a secret introduced by any
# commit on the branch -- including one a bypassed local hook let through --
# has to be caught regardless of which push surfaces it or which files the
# newest commit touched. A path allowlist would gate the scan on the same
# "files we thought about" list whose gaps are the actual leak path.
#
# trufflehog has no --redact flag and prints raw secret values on stdout.
# Public repos have public Actions logs, so the trufflehog job never runs the
# tool directly: the step below takes its JSON and prints only
# detector/file/commit, never the value. That redaction logic is inlined here
# rather than kept as a separate script so a caller needs no second checkout
# of this repository to use it.
#
# This replaces near-identical copies of both jobs that used to live in
# mark-brannan/dotfiles, mark-brannan/symphony and mark-brannan/colregs-engine.
# A caller adds its own repo-specific jobs (sops/encryption checks, tooling
# tests) alongside this one; those don't generalize because they call local
# scripts.
#
# Scanner versions are pinned in docker/gitleaks/Dockerfile and
# docker/trufflehog/Dockerfile -- never built, just a FROM line each -- so
# Dependabot (.github/dependabot.yml) has a real manifest to bump instead of
# a string embedded in this YAML that it can't see. Ported from
# mark-brannan/symphony's docker/{gitleaks,trufflehog}/Dockerfile
# (2026-09-05): before this, the version lived as a bash variable here,
# invisible to Dependabot, and every caller silently pinned to whatever
# version this file happened to hardcode on the day it was written.
#
#     jobs:
#       secret-scan:
#         uses: mark-brannan/.github/.github/workflows/secret-scan.yml@main
#         with:
#           gitleaks-config: .gitleaks.toml   # omit if the repo has none

on:
  workflow_call:
    inputs:
      gitleaks-config:
        description: Path to a gitleaks config file (e.g. .gitleaks.toml), relative to the repo root; omit for no --config
        required: false
        type: string
        default: ''

jobs:
  # Pattern/entropy scan over the entire history, not just the diff --
  # catches a secret introduced in any commit on the branch, including one
  # that a bypassed local hook let through. Version comes from
  # docker/gitleaks/Dockerfile, so Dependabot has one manifest to bump.
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # The checkout above is the CALLER's repo (workflow_call runs in the
      # caller's context) -- it doesn't have our version-pin Dockerfiles.
      # Pull just those two files from this repo instead.
      - uses: actions/checkout@v7
        with:
          repository: mark-brannan/.github
          sparse-checkout: docker/gitleaks
          path: .secret-scan-pins
          persist-credentials: false
      - name: gitleaks (full history)
        env:
          GITLEAKS_CONFIG: ${{ inputs.gitleaks-config }}
        run: |
          image="$(grep -m1 '^FROM ' .secret-scan-pins/docker/gitleaks/Dockerfile | awk '{print $2}')"
          config_flag=()
          if [ -n "$GITLEAKS_CONFIG" ]; then
            config_flag=(--config "/repo/${GITLEAKS_CONFIG}")
          fi
          docker run --rm -v "$PWD:/repo" -w /repo \
            "$image" \
            git --no-banner --redact --verbose \
            "${config_flag[@]}" \
            --exit-code 1

  # Complements gitleaks rather than duplicating it: trufflehog calls the
  # provider API to check whether a candidate credential is actually live.
  # It fails only on confirmed-live secrets, so a red build here is never a
  # false alarm and is always urgent.
  trufflehog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Same reasoning as the gitleaks job above: pull just the pin file
      # from this repo, not the caller's.
      - uses: actions/checkout@v7
        with:
          repository: mark-brannan/.github
          sparse-checkout: docker/trufflehog
          path: .secret-scan-pins
          persist-credentials: false
      - name: trufflehog (verified-live secrets, full history)
        run: |
          set -euo pipefail
          image="$(grep -m1 '^FROM ' .secret-scan-pins/docker/trufflehog/Dockerfile | awk '{print $2}')"
          REPORT="$(mktemp)"
          trap 'rm -f "$REPORT"' EXIT

          echo "Scanning full history for verified-live secrets (${image})..."

          # --fail is deliberately NOT passed: we want the JSON regardless,
          # and this step decides the exit status after redacting.
          docker run --rm -v "$PWD:/repo" "$image" \
            git file:///repo --results=verified --json --no-update >"$REPORT" 2>/dev/null || true

          python3 - "$REPORT" <<'PY'
          import json
          import sys

          findings = []
          with open(sys.argv[1]) as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      record = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if record.get("DetectorName"):
                      findings.append(record)

          if not findings:
              print("OK: no live credentials found in git history.")
              sys.exit(0)

          print(f"\n{'=' * 70}")
          print(f"{len(findings)} VERIFIED LIVE CREDENTIAL(S) IN GIT HISTORY")
          print(f"{'=' * 70}\n")

          for record in findings:
              meta = record.get("SourceMetadata", {}).get("Data", {}).get("Git", {})
              # Deliberately never printing record["Raw"] / ["Redacted"] --
              # the point of this step is that the value stays out of
              # public CI logs.
              print(f"  detector : {record.get('DetectorName')}")
              print(f"  file     : {meta.get('file', '?')}")
              print(f"  commit   : {str(meta.get('commit', '?'))[:12]}")
              print(f"  date     : {meta.get('timestamp', '?')}")
              print()

          print("These credentials are LIVE and PUBLIC. In priority order:")
          print("  1. Rotate them at the provider NOW. Revocation is the only fix")
          print("     that matters -- rewriting git history does not un-publish a")
          print("     secret.")
          print("  2. Then remove/re-encrypt the value (if applicable) and force-push")
          print("     the cleanup, but only after rotation -- history rewrite alone")
          print("     does not help.")
          sys.exit(1)
          PY
