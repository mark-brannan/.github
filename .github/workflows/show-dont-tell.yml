name: show-dont-tell

# A pull request that touches a rendered path must show it: an image or a
# preview URL in its description, else this check is red. Why: a change to
# what people see is judged by looking, and a description that only tells
# ("tweaked the header spacing") makes the reviewer rebuild the page to find
# out. Opt-in per repository; a repository without the file below passes
# with a note.
#
# Caller, in the repository's own workflow (the `edited` type is what makes
# a description edit re-run the check, so keep it):
#
#     on:
#       pull_request:
#         types: [opened, edited, synchronize, reopened]
#     jobs:
#       show-dont-tell:
#         permissions: { contents: read, pull-requests: read }
#         uses: mark-brannan/.github/.github/workflows/show-dont-tell.yml@main
#
# Opt-in file, `.github/show-dont-tell.yml` in the calling repository, read
# at the PR's base commit (a PR cannot exempt itself by editing it):
#
#     paths:               # globs of rendered files; ** crosses /, * and ? do not
#       - "web/**"
#       - "screenshots/goldens/**"
#     urls:                # optional: prefixes of this repo's preview URLs
#       - https://preview.example.com/
#     checkout: ~/searoom  # optional, default ~/<repo name>: the user's local clone; the Try it block is written against it
#     install: npm ci      # optional: omitted from the block when empty
#     serve: npm run dev -- --strictPort --port {port}   # {port} = 10000 + PR number
#
# A repository that sets `serve:` also owes a "Try it" block: when a rendered
# path is touched, the description must carry a `## Try it` heading followed
# by text containing `pull/<N>/head` for this PR's N, else the check is red,
# in addition to the picture-or-URL rule below. Why: the thing to show in a
# UX repo is the running page, and one paste (fetch the PR head, move a
# detached worktree, install, serve on port 10000 + N) beats rebuilding it by
# hand. The red summary prints the block rendered from the fields above, with
# the PR's head SHA, so an agent pastes it into the description. Without
# `serve:` the check behaves as before.
#
# What satisfies the check: an inline image anywhere in the description
# (`![..](..)`, `<img src=..>`, a github.com/user-attachments upload), or a
# link starting with one of the `urls:` prefixes. With `urls:` absent only an
# image counts: "any https link" was met by the agent attribution link
# (https://claude.com/claude-code) in every agent-written body, so the check
# would never have fired on one. Green with "no rendered path
# touched" when no changed file matches. The description is read live from
# the API, not the event payload, so an edit is judged on its new text.
# Renamed files match on both old and new name. Needs only read scopes.
# (The caller checks nothing out; the job reads the file through the API.)
#
# The script is .github/scripts/show-dont-tell.mjs in this repository (node
# built-ins only, so the job is seconds); it is fetched from `engine-ref`,
# main by default, as golden-diff.yml does, so a caller can try a branch.

on:
  workflow_call:
    inputs:
      config:
        description: "Path of the opt-in file in the calling repository"
        type: string
        default: ".github/show-dont-tell.yml"
      engine-ref:
        description: "Ref of mark-brannan/.github to fetch the script from; override to try a branch from a caller before it lands"
        type: string
        default: main

jobs:
  show-dont-tell:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      SCRIPT: ${{ github.repository == 'mark-brannan/.github' && '.github/scripts' || '.show-dont-tell-engine/.github/scripts' }}
    steps:
      - if: github.repository == 'mark-brannan/.github'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: github.repository != 'mark-brannan/.github'
        uses: actions/checkout@v7
        with:
          repository: mark-brannan/.github
          ref: ${{ inputs.engine-ref }}
          sparse-checkout: |
            /.github/scripts/show-dont-tell.mjs
          sparse-checkout-cone-mode: false
          path: .show-dont-tell-engine
          persist-credentials: false
      - name: The description shows what the rendered paths changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CONFIG: ${{ inputs.config }}
        run: |
          set -euo pipefail
          rc=0
          node "$SCRIPT/show-dont-tell.mjs" "$CONFIG" > "$RUNNER_TEMP/sdt.md" || rc=$?
          cat "$RUNNER_TEMP/sdt.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/sdt.md"
          exit "$rc"
